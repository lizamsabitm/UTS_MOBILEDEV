name: layarboxd
description: A Letterboxd-inspired Flutter app for UTS Mobile Development.
publish_to: 'none' # This is a private package.
version: 0.1.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  intl: ^0.18.0
  # Add other dependencies as needed but keep minimal.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
